<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
body{
  font-family: Arial, sans-serif;
  margin:10px;
  background:white;
}

h2{
  font-size:20px;
  margin-bottom:10px;
}

.menu-item{
  margin-bottom:10px;
}

.menu-day{
  font-weight:bold;
}

.menu-food{
  font-size:14px;
}
</style>

</head>

<body>

<h2>Brita-kahvilan viikon menu</h2>

<div id="menu">Haetaan menu...</div>

<script>

fetch("https://script.google.com/macros/s/AKfycbxBcHHX5JasQMtmeqBvwQdUazcBbvKpc18iI4PoGKomdHW6P655IEwPP6Dql0W7o-SG/exec")
.then(r => r.text())
.then(html => {
  document.getElementById("menu").innerHTML = html;
})
.catch(() => {
  document.getElementById("menu").innerText = "Menu ei saatavilla";
});

</script>

</body>
</html>
